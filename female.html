<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Female Page</title>
  <style>
    body {
      background-color: #2c2d30;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    .card {
      background-color: #c9babc;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      width: 300px;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background: #d63384;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to the Female section!</h1>
    <p>Please go to the male section temporarily. <br>"If you value your peace". </p>
    <a href="fc.html">Go Back</a>
  </div>
  <script src="https://jsdelivr.net"></script>

  <script>
    const backBtn = document.getElementById('backBtn');

    backBtn.addEventListener('click', function(e) {
      e.preventDefault(); // Stops instant page jump so confetti can play

      // Fire birthday confetti explosion from the center
      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });

      // Wait 1.2 seconds (1200ms) for confetti to burst, then go back to fc.html
      setTimeout(() => {
        window.location.href = 'fc.html';
      }, 1200);
    });
  </script>
</body>
</html>
